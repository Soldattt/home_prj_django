{% extends 'blogs/base.html'%}
{% load tags %}
{% block content %}

<div class="album py-5 bg-body-tertiary">

        <div class="container">

          <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-3">

            {% for blog in blogs %}
            <div class="col">

              <div class="card shadow-sm">
                <img src="{{ blog.image | media }}">
                <div class="card-body">
                  <a> {{ blog.title| upper }}</a>
                  <p class="card-text ">
                    {{ blog.content| truncatechars:100 }}
                  </p>
                  <p class="card-text">
                    {{ blog.created_at| date:"d M Y" }}
                  </p>
                  <p class="card-text">
                    Просмотров:
                    {{ blog.count }}
                  </p>
                  <div
                    class="d-flex justify-content-between align-items-center"
                  >
                    <div class="btn-group">
                      <a class="btn btn-dark" href="{% url 'blog:blog_detail' blog.pk %}" role="button">Подробнее</a>

                      </button>
                    </div>

                  </div>
                </div>
              </div>
            </div>
            {% endfor %}

          </div>
        </div>
      </div>

{% endblock %}
