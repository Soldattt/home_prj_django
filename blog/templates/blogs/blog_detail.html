{% extends 'blogs/base.html' %}
{% load tags %}
{% block content %}
<div class="album py-5 bg-body-tertiary">
  <div class="container">
    <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-3">
      <div class="col">
        <div class="card shadow-sm">
          <img src="{{ blog.image | media }}">
          <div class="card-body">
            <a> {{ blog.title| upper }}</a>
            <p class="card-text">
              Дата публикации:
              {{ blog.created_at }}
            </p>
            <p class="card-text">
              Содержание:
              {{ blog.content }}
            </p>

            <div class="d-flex justify-content-between align-items-center">
              <div class="btn-group">
                <a class="btn btn-dark" href="{% url 'blog:blog_update' blog.pk %}" role="button">Редактировать</a>
                <a class="btn btn-danger" href="{% url 'blog:blog_delete' blog.pk %}" role="button">Удалить</a>


              </div>
            </div>
          </div>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>
{% endblock %}
